<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Auto base path: works on Live Server + GitHub Pages project site (/career_page/) -->
  <script>
    const isLocal = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
    document.write(`<base href="${isLocal ? '/' : '/career_page/'}">`);
  </script>

  <title>Selected Research — Brendan McCann</title>
  <link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/patch.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="topbar-inner">
        <!-- LEFT: identity -->
        <div class="identity">
          <img class="headshot" src="assets/img/headshot.jpeg" alt="Headshot" />
          <div class="nameblock">
            <div id="displayName" class="name"></div>
            <div id="subtitle" class="subline"></div>
            <div class="undername-actions">
              <a id="resumeDownload" class="btn primary icon compact" href="assets/docs/resume.pdf" download>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="M7 10l5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                Resume
              </a>
              <a id="coverDownload" class="btn icon compact" href="assets/docs/cover-letter.pdf" download>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="M7 10l5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                Cover
              </a>
            </div>
          </div>
        </div>

        <!-- RIGHT: title + tabs + actions -->
        <div class="rightrail">
          <div class="rail-top">
            <div class="page-title">Selected Research</div>
            <a id="morningstarLink" class="btn icon compact" href="#" target="_blank" rel="noreferrer">
              Morningstar Profile
            </a>
          </div>
          <nav class="tabs-inline" aria-label="Selected research tabs">
            <div class="tabs-inner" id="tabs"></div>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">

      <!-- PDF viewer -->
      <section id="pdfCard" class="viewer-card">
        <div class="viewer-head">
          <div class="viewer-head-left">
            <h1 id="viewerTitle" class="viewer-title"></h1>
            <div id="viewerDesc" class="viewer-desc"></div>
            <div id="viewerMeta" class="viewer-meta"></div>
          </div>
          <div class="viewer-actions">
            <button id="zoomOut" class="btn compact" type="button" aria-label="Zoom out">−</button>
            <button id="zoomIn" class="btn compact" type="button" aria-label="Zoom in">+</button>
            <button id="fitWidth" class="btn compact" type="button">Fit</button>
            <a id="openNewTab" class="btn compact" href="#" target="_blank" rel="noreferrer">Open</a>
            <a id="downloadBtn" class="btn compact" href="#" download>Download</a>
          </div>
        </div>

        <!-- Native browser PDF viewer (reliable on GitHub Pages + localhost) -->
        <iframe id="pdfFrame" class="pdf-frame" title="PDF"></iframe>

        <div id="pdfError" class="page" style="display:none;"></div>
      </section>

      <!-- Web viewer -->
      <section id="webCard" class="viewer-card" style="display:none;">
        <div class="viewer-head">
          <div class="viewer-head-left">
            <h1 id="webTitle" class="viewer-title"></h1>
            <div id="webDesc" class="viewer-desc"></div>
            <div class="viewer-meta">Web</div>
          </div>
          <div class="viewer-actions">
            <a id="webOpenNewTab" class="btn compact" href="#" target="_blank" rel="noreferrer">Open</a>
          </div>
        </div>

        

        <div id="webPreview" class="web-preview" style="display:none;">
          <div class="web-preview-row">
            <div>
              <div class="web-preview-title" id="webPreviewTitle"></div>
              <div class="web-preview-desc" id="webPreviewDesc"></div>
            </div>
            <div class="web-preview-actions">
              <a id="webOpenBtn" class="btn primary icon compact" href="#" target="_blank" rel="noreferrer">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M7 17L17 7"></path>
                  <path d="M8 7h9v9"></path>
                </svg>
                Open website
              </a>
            </div>
          </div>
        </div>

        <div id="webBlocked" class="page" style="display:none;">
          <p>This site blocks embedded viewing. Use “Open”.</p>
        </div>

        <iframe id="webFrame" class="web-frame" title="Web page"></iframe>
      </section>

      <!-- HTML panel (optional internal pages) -->
      <section id="htmlCard" class="viewer-card" style="display:none;">
        <div class="page" id="htmlPanel"></div>
      </section>

    </div>
  </main>

  <script src="js/site.config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
