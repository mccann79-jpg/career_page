<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/career_page/">
  <title>Brendan McCann — Research</title>
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <div class="topbar-inner">
        <div class="identity">
          <img class="headshot" src="assets/img/headshot.jpeg" alt="Headshot" />
          <div class="nameblock">
            <div id="displayName" class="name"></div>
            <div id="subtitle" class="subline"></div>
          </div>
        </div>

        <div class="header-actions">
          <a id="morningstarLink" class="btn icon" href="#" target="_blank" rel="noreferrer">
            Morningstar Profile
          </a>
          <a id="resumeDownload" class="btn primary icon" href="assets/docs/resume.pdf" download>
            Download Resume
          </a>
        </div>
      </div>

      <nav class="tabs">
        <div class="tabs-inner" id="tabs" aria-label="Research tabs"></div>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <section class="viewer-card">
        <div class="viewer-head">
          <div>
            <h1 id="viewerTitle" class="viewer-title"></h1>
            <div id="viewerMeta" class="viewer-meta">PDF</div>
          </div>
          <div class="viewer-actions">
            <a id="openNewTab" class="btn" href="#" target="_blank" rel="noreferrer">Open in new tab</a>
            <a id="downloadBtn" class="btn" href="#" download>Download</a>
          </div>
        </div>

        <iframe id="pdfFrame" class="pdf-frame" title="Document viewer"></iframe>
        <div id="pageContainer" style="display:none"></div>
      </section>
    </div>
  </main>

  <script src="js/site.config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
